[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
lasna = "${LASNA_RPC_URL}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[invariant]
runs = 128
depth = 100
fail_on_revert = false
